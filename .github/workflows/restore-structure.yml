name: Restore MerchantOS Structure

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_TOKEN }}
          fetch-depth: 0

      - name: Extract and restore MerchantOS
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="MerchantOS_v8_0_FIXED_GITHUB_UPLOAD.zip"

          echo "Checking uploaded archive..."

          if [ ! -f "$ARCHIVE" ]; then
            echo "ERROR: Archive not found."
            exit 1
          fi

          mkdir -p /tmp/merchantos

          unzip -q "$ARCHIVE" -d /tmp/merchantos

          echo "Verifying project..."

          test -f /tmp/merchantos/README.md
          test -d /tmp/merchantos/app
          test -d /tmp/merchantos/frontend
          test -d /tmp/merchantos/tests
          test -d /tmp/merchantos/.github/workflows

          echo "Project verification passed."

          echo "Removing flattened files..."

          git rm -r --ignore-unmatch .

          echo "Restoring original directory structure..."

          cp -a /tmp/merchantos/. .

          rm -f "$ARCHIVE"

          echo "Checking restored structure..."

          test -f README.md
          test -d app
          test -d frontend
          test -d tests
          test -f .github/workflows/ci.yml

          git add -A

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Restore MerchantOS v8.0 project structure"

          git push origin HEAD:main

          echo "MerchantOS restoration completed!"
