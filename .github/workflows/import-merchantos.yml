name: Import and Arrange MerchantOS

on:
  workflow_dispatch:
  push:
    paths:
      - "MerchantOS_COMPETITION_COMPLETED_BUILD.zip"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract and arrange MerchantOS
        run: |
          python - <<'PY'
          import os
          import zipfile
          import shutil
          from pathlib import Path, PurePosixPath

          archive = Path("MerchantOS_COMPETITION_COMPLETED_BUILD.zip")
          destination = Path(".")

          if not archive.exists():
              raise SystemExit("MerchantOS ZIP not found in repository root")

          temp = Path("/tmp/merchantos-import")
          shutil.rmtree(temp, ignore_errors=True)
          temp.mkdir(parents=True)

          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  path = PurePosixPath(item.filename)

                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Unsafe ZIP path: {item.filename}")

                  if path.parts and path.parts[0] != "Merchant.Os-main":
                      raise SystemExit(f"Unexpected ZIP root: {item.filename}")

              z.extractall(temp)

          source = temp / "Merchant.Os-main"

          if not source.is_dir():
              raise SystemExit("Expected Merchant.Os-main folder not found")

          excluded = {
              ".git", "node_modules", "__pycache__",
              ".pytest_cache", "dist", "build"
          }

          for current, dirs, files in os.walk(source):
              dirs[:] = [d for d in dirs if d not in excluded]

              relative = Path(current).relative_to(source)
              target = destination / relative
              target.mkdir(parents=True, exist_ok=True)

              for filename in files:
                  if filename == ".env" or filename.startswith(".env."):
                      continue

                  if filename.endswith((".pyc", ".pyo", ".db", ".sqlite", ".sqlite3")):
                      continue

                  src = Path(current) / filename
                  dst = target / filename

                  dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(src, dst)

          print("MerchantOS files arranged successfully.")
          PY

      - name: Commit arranged files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Import and arrange MerchantOS final build"
            git push
          fi
