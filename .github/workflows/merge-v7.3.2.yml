name: Merge MerchantOS v7.3.2 archive

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: merchantos-v7-3-2-archive-merge
  cancel-in-progress: false

jobs:
  merge-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create integration branch
        shell: bash
        run: |
          BRANCH="integration/merchantos-v7.3.2-${GITHUB_RUN_ID}"

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -c "$BRANCH"

          echo "INTEGRATION_BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Safely extract and merge archive
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import stat
          import zipfile

          archive = Path(
              "MerchantOS-v7.3.2-Security-Privacy-Hardened-Full.zip"
          )

          if not archive.is_file():
              raise SystemExit("MerchantOS archive not found.")

          repo = Path.cwd().resolve()

          added = []
          updated = []
          unchanged = []
          skipped = []

          with zipfile.ZipFile(archive) as zf:

              entries = [
                  item for item in zf.infolist()
                  if not item.is_dir()
              ]

              if not entries:
                  raise SystemExit("Archive is empty.")

              normalized = []
              roots = set()

              # Validate every archive path before extraction.
              for info in entries:

                  raw = info.filename.replace("\\", "/")
                  path = PurePosixPath(raw)

                  mode = (info.external_attr >> 16) & 0xFFFF

                  if (
                      path.is_absolute()
                      or ".." in path.parts
                      or not path.parts
                  ):
                      raise SystemExit(
                          f"Unsafe archive path: {raw}"
                      )

                  if stat.S_ISLNK(mode):
                      raise SystemExit(
                          f"Symlink rejected: {raw}"
                      )

                  roots.add(path.parts[0])
                  normalized.append((info, path))

              if len(roots) != 1:
                  raise SystemExit(
                      f"Unexpected archive roots: {roots}"
                  )

              wrapper = next(iter(roots))

              for info, path in normalized:

                  if (
                      path.parts[0] != wrapper
                      or len(path.parts) < 2
                  ):
                      raise SystemExit(
                          f"Unexpected archive layout: {info.filename}"
                      )

              # Merge archive contents into repository root.
              for info, path in normalized:

                  relative = PurePosixPath(*path.parts[1:])
                  rel = relative.as_posix()

                  # Never import Git metadata.
                  if rel == ".git" or rel.startswith(".git/"):
                      skipped.append(rel)
                      continue

                  # Preserve existing GitHub Actions workflows.
                  # Avoid GitHub's restricted workflow-token permission.
                  if rel.startswith(".github/workflows/"):
                      skipped.append(
                          rel + " (workflow preserved)"
                      )
                      continue

                  target = (
                      repo / Path(*relative.parts)
                  ).resolve()

                  if repo not in target.parents:
                      raise SystemExit(
                          f"Path escaped repository: {rel}"
                      )

                  target.parent.mkdir(
                      parents=True,
                      exist_ok=True
                  )

                  data = zf.read(info)

                  if target.exists():

                      if (
                          target.is_symlink()
                          or not target.is_file()
                      ):
                          raise SystemExit(
                              f"Unsafe overwrite: {rel}"
                          )

                      if target.read_bytes() == data:
                          unchanged.append(rel)
                          continue

                      updated.append(rel)

                  else:
                      added.append(rel)

                  target.write_bytes(data)

          # Remove uploaded ZIP from integration branch.
          archive.unlink()

          report = [
              "# MerchantOS v7.3.2 Merge Report",
              "",
              f"- Added: {len(added)}",
              f"- Updated: {len(updated)}",
              f"- Unchanged: {len(unchanged)}",
              f"- Skipped: {len(skipped)}",
              "",
              "## Updated files",
              *[f"- {x}" for x in updated],
              "",
              "## Added files",
              *[f"- {x}" for x in added],
              "",
              "## Skipped files",
              *[f"- {x}" for x in skipped],
          ]

          Path(
              "MERCHANTOS_V7_3_2_MERGE_REPORT.md"
          ).write_text(
              "\n".join(report) + "\n",
              encoding="utf-8"
          )

          print("\n".join(report))
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile backend
        run: |
          python -m compileall -q app

      - name: Run tests
        run: |
          python -m pytest -q

      - name: Commit integration
        shell: bash
        run: |
          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 1
          fi

          git commit -m \
            "Integrate MerchantOS v7.3.2 security and privacy"

          git push --set-upstream origin "$INTEGRATION_BRANCH"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base main \
            --head "$INTEGRATION_BRANCH" \
            --title "MerchantOS v7.3.2 Integration" \
            --body "Automated integration of MerchantOS v7.3.2. Review the merge report, security changes and test results before merging. Main remains unchanged."

      - name: Upload merge report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merchantos-v7.3.2-merge-report
          path: MERCHANTOS_V7_3_2_MERGE_REPORT.md
          if-no-files-found: ignore
